<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tep-mining Reports</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; color: #1f2328; background: #ffffff;
    display: flex; flex-direction: column;
  }
  header { padding: 20px 24px 0; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: #57606a; font-size: 13px; margin-bottom: 16px; }
  .tabs {
    display: flex; gap: 4px; padding: 0 20px;
    border-bottom: 1px solid #e5e7eb; flex-wrap: wrap;
  }
  .tab {
    appearance: none; border: 1px solid transparent; border-bottom: none;
    background: transparent; cursor: pointer;
    padding: 9px 16px; font-size: 13px; font-weight: 500; color: #57606a;
    border-radius: 6px 6px 0 0;
  }
  .tab:hover { background: #f7f8fa; color: #1f2328; }
  .tab.active {
    background: #ffffff; color: #1f2328;
    border-color: #e5e7eb; border-bottom: 1px solid #ffffff;
    margin-bottom: -1px;
  }
  .panels { flex: 1; position: relative; }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; display: none;
  }
  iframe.active { display: block; }
  .empty { padding: 40px 24px; color: #57606a; }
</style>
</head>
<body>
<header>
  <h1>tep-mining Reports</h1>
  <p class="subtitle">4 report(s) from reports/*.html</p>
</header>
<div class="tabs"><button class="tab active" data-target="gap_report" onclick="showTab('gap_report')">TEP Number Gap Report</button><button class="tab" data-target="impl_prs_report" onclick="showTab('impl_prs_report')">Implementation PR Report</button><button class="tab" data-target="pr_map_report" onclick="showTab('pr_map_report')">TEP Proposal PR Mapping Report</button><button class="tab" data-target="tep_pr_reviews" onclick="showTab('tep_pr_reviews')">TEP Proposal PR Review Report</button></div>
<div class="panels"><iframe id="gap_report" class="active" src="gap_report.html" title="TEP Number Gap Report"></iframe><iframe id="impl_prs_report" class="" src="impl_prs_report.html" title="Implementation PR Report"></iframe><iframe id="pr_map_report" class="" src="pr_map_report.html" title="TEP Proposal PR Mapping Report"></iframe><iframe id="tep_pr_reviews" class="" src="tep_pr_reviews.html" title="TEP Proposal PR Review Report"></iframe></div>
<script>
function showTab(id) {
  document.querySelectorAll('.tab').forEach(function (el) {
    el.classList.toggle('active', el.dataset.target === id);
  });
  document.querySelectorAll('iframe').forEach(function (el) {
    el.classList.toggle('active', el.id === id);
  });
  window.location.hash = id;
}
window.addEventListener('DOMContentLoaded', function () {
  var initial = window.location.hash.replace('#', '');
  var tabs = document.querySelectorAll('.tab');
  if (!initial || !document.getElementById(initial)) {
    initial = tabs.length ? tabs[0].dataset.target : '';
  }
  if (initial) showTab(initial);
});
</script>
</body>
</html>
