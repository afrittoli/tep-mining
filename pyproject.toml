[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tep-mining"
version = "0.1.0"
description = "Corpus mining scripts for TEP-0192 Phase 0a"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3",
    "ruamel.yaml>=0.18.6",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "duckdb>=1.1.3",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "types-requests>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
