[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tep-mining"
version = "0.1.0"
description = "Corpus mining scripts for TEP-0192 Phase 0a"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3",
    "ruamel.yaml>=0.18.6",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "duckdb>=1.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
